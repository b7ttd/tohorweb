user http;
worker_processes 1;

error_log /var/log/nginx/error.log;

events {
	worker_connections 1024;
}

http {
	types_hash_max_size 1024;			
		server {
			listen 80;
			server_name localhost;
			root /srv/http/tohorweb; 
			include /etc/nginx/mime.types;
			index /index.php;

			location / {
				try_files $uri $uri/ /templates$uri /templates$uri.php /error_page.html;
			}
		
			location ~ \.php$ {
				fastcgi_split_path_info ^(.+\.php)(/.+)$;
				fastcgi_pass unix:/run/php-fpm/php-fpm.sock;
				fastcgi_index index.php;
				fastcgi_param SCRIPT_FILENAME $document_root/templates$fastcgi_script_name;
				include fastcgi_params;
			}

			location /static/ {
				alias /srv/http/tohorweb/static/;
			}
		
#		location /templates/ {
#				alias /srv/http/tohorweb/templates/;
#			}
			error_page 404 /error_page.html;
			location = /templates/error_page.html {
				internal;
			}
	}
}
